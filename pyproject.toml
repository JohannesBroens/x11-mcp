[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x11-mcp"
version = "0.1.0"
description = "Native X11 MCP server for Claude Code — bare-metal desktop automation"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "python-xlib>=0.33",
    "python-uinput>=1.0.1",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/x11_mcp"]

[tool.pytest.ini_options]
markers = ["x11: requires X11 display (deselect with -m 'not x11')"]
